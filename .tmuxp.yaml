session_name: tarts
environment:
  RUST_LOG: info
shell_command_before: "clear"
windows:
  - window_name: code
    start-directory: ./
    panes:
      - shell_command:
        - hx
  - window_name: agent
    focus: true
    start-directory: ./
    panes:
      - shell_command:
        - herdr session stop tarts; herdr --session tarts
  - window_name: cmd1
    start-directory: ./
    panes:
      - shell_command:
        - eza --long
  - window_name: cmd2
    panes:
      - shell_command:
        - eza --long
  - window_name: files
    panes:
      - shell_command:
        - yazi
