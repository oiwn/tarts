name: Publish to crates.io

# Tag-driven only: pushing a vX.Y.Z tag publishes. Never fires on main pushes,
# so a Cargo.toml version bump merged from a contributor PR cannot publish.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Verify tag matches Cargo.toml version
      run: |
        CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f 2)
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        echo "Cargo.toml: $CURRENT_VERSION  Tag: $TAG_VERSION"
        if [ "$CURRENT_VERSION" != "$TAG_VERSION" ]; then
          echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $CURRENT_VERSION" >&2
          exit 1
        fi

    - name: Check if package is publishable
      run: cargo publish --dry-run --allow-dirty

    - name: Publish to crates.io
      run: cargo publish --allow-dirty --token ${{ secrets.CRATES_IO_TOKEN }}
